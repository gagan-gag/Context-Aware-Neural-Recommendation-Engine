services:
  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: avero-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - avero-net

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    container_name: avero-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      AVERO_MODE: demo
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data:ro
      - api_logs:/app/logs
    networks:
      - avero-net

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend/avero-next
      dockerfile: Dockerfile
    container_name: avero-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 2>/dev/null | head -c 1 | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - avero-net

  # Test runner (profile-gated)
  spark-tests:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    container_name: avero-tests
    working_dir: /app
    environment:
      PYTHONPATH: /app
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_DIRS: /tmp/spark-local
      AVERO_MODE: demo
    volumes:
      - .:/app
    command: ["pytest", "-q", "--tb=short", "ml/tests"]
    profiles:
      - testing
    networks:
      - avero-net

volumes:
  redis_data:
    driver: local
  api_logs:
    driver: local

networks:
  avero-net:
    driver: bridge
    name: avero-network