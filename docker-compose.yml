services:
  spark-tests:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      PYTHONPATH: /app
      PYSPARK_PYTHON: /usr/local/bin/python
      PYSPARK_DRIVER_PYTHON: /usr/local/bin/python
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_LOCAL_DIRS: /tmp/spark-local
      AVERO_MODE: demo
    volumes:
      - .:/app
    command: ["pytest", "-q", "ml/tests"]

