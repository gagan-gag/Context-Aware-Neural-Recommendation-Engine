apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avero-ingress
  namespace: avero
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - avero.ai
        - api.avero.ai
      secretName: avero-tls
  rules:
    # Frontend
    - host: avero.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avero-frontend
                port:
                  number: 3000
    # API
    - host: api.avero.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avero-api
                port:
                  number: 8000
