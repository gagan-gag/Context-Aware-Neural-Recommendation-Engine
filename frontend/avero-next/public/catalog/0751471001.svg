    <path d="M 300 348 Q 300 520 300 730" stroke="#D93844" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M 330 348 Q 350 520 380 720" stroke="#7A0C14" stroke-width="3" fill="none" opacity="0.7"/>
