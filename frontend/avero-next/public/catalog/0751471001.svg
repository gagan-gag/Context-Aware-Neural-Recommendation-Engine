    <path d="M 260 140 C 265 170 255 240 250 280 C 275 295 325 295 350 280 C 345 240 335 170 340 140 L 320 140 C 315 180 305 200 300 200 C 295 200 285 180 280 140 Z" fill="#991520"/>
